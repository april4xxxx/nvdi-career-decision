<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>女皇入朝｜你的 AI 职场决策大臣</title>
  <meta name="description" content="将真实职场困境转化为决策奏折、行动地图与可持续心流节奏的 AI 职场决策体验。" />
  <meta property="og:title" content="女皇入朝｜AI 职场心流决策地图" />
  <meta property="og:description" content="与 AI 御前大臣商议真实职场困境，把决策转化为可执行、可复盘的行动地图。" />
  <meta property="og:type" content="website" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@400;600;700;900&family=Noto+Sans+SC:wght@400;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/base.css" />
  <link rel="stylesheet" href="css/onboarding.css?v=result-split-gold-btn-20260725" />
  <link rel="stylesheet" href="css/app.css?v=me-bubble-black-reward-goldline-20260725" />
  <link rel="stylesheet" href="css/library.css?v=copy-revamp-20260725" />
  <link rel="stylesheet" href="css/treasury.css" />
  <link rel="stylesheet" href="css/lingyan.css?v=skills-20260725" />
</head>
<body>

  <!-- 任务卡图标渐变定义（金币 / 精力 / 时长），全局引用 use href -->
  <svg width="0" height="0" style="position:absolute" aria-hidden="true">
    <defs>
      <linearGradient id="goldGrad" x1="0" y1="0" x2="1" y2="1">
        <stop offset="0" stop-color="#f4d79a"/><stop offset=".45" stop-color="#d9a94e"/><stop offset="1" stop-color="#9a6f22"/>
      </linearGradient>
      <linearGradient id="jadeGrad" x1="0" y1="0" x2="1" y2="1">
        <stop offset="0" stop-color="#8fc9b8"/><stop offset="1" stop-color="#3f7266"/>
      </linearGradient>
      <symbol id="ic-coin" viewBox="0 0 24 24">
        <circle cx="12" cy="12" r="10" fill="url(#goldGrad)" stroke="#7d5716" stroke-width="1"/>
        <circle cx="12" cy="12" r="7" fill="none" stroke="#fff2cf" stroke-width="1" opacity=".7"/>
        <path d="M12 7.2v9.6M9.4 9.4h5.2M9.4 12h5.2" stroke="#7d5716" stroke-width="1.4" stroke-linecap="round" opacity=".85"/>
      </symbol>
      <symbol id="ic-energy" viewBox="0 0 24 24">
        <path d="M13.5 2 5 13.2h5.2L9.2 22 19 9.6h-5.6z" fill="url(#goldGrad)" stroke="#7d5716" stroke-width="1" stroke-linejoin="round"/>
      </symbol>
      <symbol id="ic-energy-rest" viewBox="0 0 24 24">
        <path d="M13.5 2 5 13.2h5.2L9.2 22 19 9.6h-5.6z" fill="url(#jadeGrad)" stroke="#2f574d" stroke-width="1" stroke-linejoin="round"/>
      </symbol>
      <symbol id="ic-time" viewBox="0 0 24 24">
        <path d="M6 3h12M6 21h12M7 3c0 5 10 5 10 9s-10 4-10 9M17 3c0 5-10 5-10 9s10 4 10 9" fill="none" stroke="url(#goldGrad)" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
      </symbol>
    </defs>
  </svg>

  <!-- ============ 屏幕 1：御前推演（Onboarding） ============ -->
  <section id="screen-onboarding" class="screen active">
    <div class="onb-wrap" id="onbWrap"><!-- onboarding.js 渲染 --></div>
  </section>

  <!-- ============ 屏幕 2：登基过场 CG ============ -->
  <section id="screen-transition" class="screen">
    <div class="cg-stage" id="cgStage">
      <button class="cg-skip" id="cgSkip">跳过 ▸</button>
      <!-- 图与文由 onboarding.js 注入 -->
    </div>
  </section>

  <!-- ============ 屏幕 3：主应用 ============ -->
  <section id="screen-app" class="screen">

    <!-- 顶栏 -->
    <header class="topbar" id="topbar"><!-- topbar.js 渲染 --></header>

    <!-- 主体：侧栏 + 舞台 -->
    <div class="app-body" id="appBody">

      <!-- 个人面板侧栏 -->
      <aside class="sidebar" id="sidebar"><!-- panel.js 渲染 --></aside>

      <!-- 舞台（场景 + 对话 + 覆盖面板） -->
      <div class="stage" id="stage">
        <div class="scene-bg" id="sceneBg"></div>
        <div class="scene-head" id="sceneHead"></div>
        <div class="task-field" id="taskField"></div>
        <img class="npc-portrait" id="npcPortrait" alt="" />

        <!-- 对话区（模块 03：GAL 折叠态 ↔ 完整对话态） -->
        <div class="convo" id="convo">
          <!-- 顶部条：仅完整态显示（当前大臣 + 主题 + 新对话 + 查看奏折 + 收起） -->
          <div class="convo-top" id="convoTop">
            <button class="ct-minister" id="ctMinister">
              和【<span id="ctMinisterName">直臣</span>】<span class="caret">▾</span>
            </button>
            <span class="ct-topic">商讨【<span id="ctTopic">如何治理自己的国家</span>】</span>
            <div class="spacer"></div>
            <button class="ct-new" id="ctNew" aria-label="开启新对话">＋ 新对话</button>
            <button class="ct-petition" id="ctPetition">查看奏折 <b id="ctPetitionN">0</b><span class="ct-petition-hint">完成任务，充盈国库</span></button>
            <button class="ct-close" id="ctClose" aria-label="收起对话" title="收起对话"><span>收起</span><b>⌄</b></button>
          </div>

          <!-- 完整对话滚动区：仅完整态显示 -->
          <div class="convo-scroll" id="convoScroll"></div>

          <!-- GAL 底部对话框：折叠态显示大臣一句话；完整态作为回复/决策区 -->
          <div class="gal-box" id="galBox">
            <div class="gal-name" id="galName">近臣</div>
            <div class="gal-text" id="galText"></div>
            <div class="reply-zone" id="replyZone"></div>
          </div>

          <!-- 常驻输入区（整段对话保持可用） -->
          <div class="convo-input" id="convoInput">
            <input type="text" id="convoText" placeholder="陛下，今日有什么烦心事吗，老臣愿为您分忧…（直接输入，臣子为您将目标落实为切实的任务）" autocomplete="off" />
            <button class="ci-send" id="convoSend">与众卿探讨</button>
          </div>
        </div>

        <!-- 奏折匣抽屉 -->
        <button class="drawer-tab" id="drawerTab">奏 折 匣</button>
        <aside class="drawer" id="drawer">
          <div class="drawer-head">
            <h3>奏折匣</h3>
            <button class="drawer-close" id="drawerClose" aria-label="关闭奏折匣" title="关闭奏折匣">×</button>
          </div>
          <div class="drawer-tabs" id="drawerTabs" role="tablist" aria-label="奏折匣内容">
            <button type="button" class="dt active" data-dt="petition" role="tab" aria-selected="true">待办奏折</button>
            <button type="button" class="dt" data-dt="journal" role="tab" aria-selected="false">起居注</button>
          </div>
          <div class="drawer-body" id="drawerBody"></div>
        </aside>

        <!-- 心流模式遮罩 -->
        <div class="flow-veil" id="flowVeil"></div>
        <!-- 预言模式遮罩 -->
        <div class="prophecy-veil" id="prophecyVeil"></div>

        <!-- 藏书阁面板 -->
        <div class="panel-screen" id="libraryPanel"></div>
        <!-- 珍宝阁面板 -->
        <div class="panel-screen" id="treasuryPanel"></div>
        <!-- 凌烟阁人物图鉴面板 -->
        <div class="panel-screen" id="lingyanPanel"></div>
      </div>
    </div>
  </section>

  <!-- ============ 全局层 ============ -->
  <div id="achToastLayer"></div>
  <div class="overlay" id="overlay"><div class="modal" id="modal"></div></div>
  <div class="demo-badge" id="demoBadge"><span class="dot"></span><span id="demoBadgeText">演示模式进行中</span></div>

  <!-- ============ 脚本：economy → data → store → 模块 → demo → main ============ -->
  <script src="js/economy.js"></script>
  <script src="js/data.js?v=template-card-v5-20260725"></script>
  <script src="js/store.js?v=demo-achievement-suppression-20260721"></script>
  <script src="js/api.js"></script>
  <script src="js/onboarding.js?v=princess-cg-nick-guard-20260725"></script>
  <script src="js/panel.js"></script>
  <script src="js/topbar.js?v=gold-btn-20260725"></script>
  <script src="js/scene.js?v=template-card-v5-20260725"></script>
  <script src="js/conversation-rules.js"></script>
  <script src="js/conversation.js?v=quiz4-minister-pref-20260725"></script>
  <script src="js/drawer.js?v=gold-btn-20260725"></script>
  <script src="js/modes.js?v=gold-btn-20260725"></script>
  <script src="js/library.js?v=copy-revamp-20260725"></script>
  <script src="js/treasury.js?v=copy-revamp-20260725"></script>
  <script src="js/lingyan.js?v=skills-20260725"></script>
  <script src="js/demo.js?v=copy-revamp-20260725"></script>
  <script src="js/main.js"></script>
</body>
</html>
